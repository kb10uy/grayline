name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # On its own because it needs neither the system packages nor the compiled
  # dependencies every other job waits for: a misformatted change is reported
  # in under a minute rather than behind a build.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # The libraries, the tools, and the browser demo's host build: everything a
  # change can break with no application involved. The two applications are
  # excluded so they can run beside this job rather than after it; each is a
  # long tail of its own, and the run used to wait for both of them in turn.
  core:
    name: Core
    runs-on: ubuntu-latest
    # Named once and reused by the three commands below, so a member that
    # leaves the core cannot be dropped from one of them alone.
    env:
      SCOPE: --workspace --exclude grayline-sstv-app --exclude grayline-wefax-app
    steps:
      # The submodule is reference material and nothing builds against it.
      - uses: actions/checkout@v5

      # alsa-sys links against ALSA, which cpal keeps as the fallback host.
      # Everything else the window and the graphics context need is opened at
      # run time rather than linked, so no X11, Wayland, or GL package is
      # required to build.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: core

      - name: Run Clippy
        run: cargo clippy $SCOPE --all-targets -- -D warnings
      - name: Run tests
        run: cargo test $SCOPE
      - name: Build the core
        run: cargo build $SCOPE

      # A workspace build does not cover this: another member enabling the
      # `std` feature hides a core primitive used through `std` alone, so the
      # crate can stop being `no_std` without any workspace command noticing.
      - name: Build the no_std crates without std
        run: |
          cargo build -p grayline-sstv --no-default-features
          cargo build -p grayline-dsp --no-default-features
          cargo build -p grayline-wefax --no-default-features

      # For the same reason, a crate that asks for no `std` feature from these
      # two is only held to it on its own: the workspace turns the feature on
      # around it and would carry a new dependency on `std` in unremarked.
      - name: Build the crates that ask for no std of their dependencies
        run: |
          cargo build -p grayline-tone-tx
          cargo build -p grayline-sstv-rx

  # One job per application, so the two compile at the same time and a failure
  # names which one broke rather than which command did. Each keeps its own
  # cache: the two dependency graphs meet at eframe and diverge after it, and
  # one key over both would have each run overwriting the other's entry.
  app:
    name: App (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SSTV
            package: grayline-sstv-app
          - name: WEFAX
            package: grayline-wefax-app
    steps:
      - uses: actions/checkout@v5

      # ALSA for the same reason as the core job.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.package }}

      - name: Run Clippy
        run: cargo clippy -p ${{ matrix.package }} --all-targets -- -D warnings
      - name: Run tests
        run: cargo test -p ${{ matrix.package }}
      - name: Build the application
        run: cargo build -p ${{ matrix.package }}

  # The browser demo is the one member whose target is not the host, and the
  # host build says nothing about it: on Linux the JavaScript bindings compile
  # to stubs that are never called, so a break in what the demo actually ships
  # only appears when the crate is built for wasm32.
  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Run Clippy for wasm32
        run: cargo clippy -p grayline-web-demo --target wasm32-unknown-unknown -- -D warnings

      # The same command the deploy workflow publishes the result of, so a build
      # that cannot produce the page fails here rather than on a push to master.
      - name: Build the browser demo
        run: wasm-pack build apps/web-demo --target web --out-dir www/pkg --release

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about

      - name: Check the licenses of the dependency graph
        run: cargo deny check licenses
      - name: Check the dependency graph for advisories
        run: cargo deny check advisories

      # The release archives carry this page, so a template or configuration
      # that cannot produce it should fail here rather than during a release.
      - name: Check that the license page can be generated
        run: cargo about generate about.hbs --output-file licenses.html

  # For the same reason the license page is checked above: the archives carry
  # the manual, and a source or template that cannot be rendered should fail on
  # the change that broke it.
  manual:
    name: Manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc

      - name: Build the manual
        run: bash docs/help/build.sh
