name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# A cancelled deploy leaves the site on the previous build, so a queued one
# waits for the deploy in flight rather than replacing it.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The entry the CI workflow's WebAssembly job writes, read rather than
      # written: that job runs the same wasm-pack command over a target
      # directory that also holds its Clippy build, so its copy is the fuller
      # one. Both workflows answer the same push, so what this restores is what
      # the previous push left rather than what is being built beside it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # Cloudflare's own builds carry Node, Python, Go, and Ruby and no Rust,
      # so the module is built here and `wrangler` only uploads the result.
      - name: Build the browser demo
        run: wasm-pack build apps/web-demo --target web --out-dir www/pkg --release

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/web-demo
          command: deploy
