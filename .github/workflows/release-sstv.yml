name: Release SSTV

on:
  push:
    tags: ["sstv-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build, such as sstv-v0.3.1
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/release-app.yml
    permissions:
      contents: write
    with:
      app: sstv
      title: Grayline SSTV
      ref: ${{ inputs.tag || github.ref_name }}
      templates: true
      notes: |
        Each download holds the `grayline-sstv` application, this project's
        license, the licenses of its dependencies as `licenses.html`, and the
        MMSSTV templates ported to the KDL format. The manual is on the web,
        at <https://grayline.jl1his.radio/sstv/>, which the Help menu opens.

        | Platform | Download |
        | --- | --- |
        | Windows x86_64 | `grayline-sstv-@VERSION@-x86_64-pc-windows-msvc.zip` |
        | Linux x86_64 | `grayline-sstv-@VERSION@-x86_64-unknown-linux-gnu.tar.gz` |
        | macOS Apple Silicon | `grayline-sstv-@VERSION@-aarch64-apple-darwin.dmg` |

        The macOS disk image installs by dragging `GraylineSSTV.app` into
        `Applications`. The bundle is ad-hoc signed rather than notarized,
        so open the first launch from the context menu, or clear the
        quarantine attribute:

        ```text
        xattr -dr com.apple.quarantine /Applications/GraylineSSTV.app
        ```

        The Linux archive carries `assets/grayline-sstv.desktop` and
        `assets/icon.png`; installing both is what makes the window icon
        appear, as `README.md` describes.

        Downloads can be checked against `SHA256SUMS`.
