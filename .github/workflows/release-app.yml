name: Release an application

# Called by one workflow per application. Everything an application does not
# share with the others — which tag names it, what its archives hold, and what
# its release notes say — is an input, so a third application is a caller
# rather than a copy of this file.
on:
  workflow_call:
    inputs:
      app:
        description: The application's directory under apps/, such as sstv
        required: true
        type: string
      title:
        description: The product name the release is titled with
        required: true
        type: string
      ref:
        description: The tag to build, such as sstv-v0.3.1
        required: true
        type: string
      templates:
        description: Whether the archives carry assets/templates/
        type: boolean
        default: false
      notes:
        description: The release notes, with @VERSION@ where the version goes
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag names the release and the executable carries the version compiled
  # into it, so the two disagreeing is a mistake worth catching before three
  # runners spend a release build on it.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag against the application's version
        id: resolve
        env:
          TAG: ${{ inputs.ref }}
          APP: ${{ inputs.app }}
        run: |
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg name "grayline-$APP-app" \
              '.packages[] | select(.name == $name) | .version')"
          if [ "$TAG" != "$APP-v$version" ]; then
            echo "the tag $TAG does not name version $version of grayline-$APP-app" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    # bash on all three runners so the steps below read the same environment;
    # the two steps that need PowerShell ask for it themselves.
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ inputs.app }}
      BINARY: grayline-${{ inputs.app }}
      PACKAGE: grayline-${{ inputs.app }}-app
      TARGET: ${{ matrix.target }}
      ARCHIVE: grayline-${{ inputs.app }}-v${{ needs.prepare.outputs.version }}-${{ matrix.target }}
      # Empty when the application does not carry them, which is what the
      # bundle script reads as "leave this out".
      TEMPLATES: ${{ inputs.templates && 'assets/templates' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev mold

      # No compilation cache here, unlike the CI workflow. A cache entry
      # belongs to the ref that wrote it, and every release is a new tag, so an
      # entry written here is read by a re-run of the same tag and by nothing
      # else — a copy of a release target directory kept, at the repository's
      # expense, against a rebuild that usually never comes.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Build the release executable
        run: cargo build --release --locked --target "$TARGET" -p "$PACKAGE"

      # A dependency on the Visual C++ redistributable is the one thing an
      # archive cannot repair on the operator's machine, so the invariant is
      # checked rather than trusted: `RUSTFLAGS` in the environment replaces
      # the flag in `.cargo/config.toml` without a word about it.
      - name: Check that the Windows executable needs no C runtime DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "target/${env:TARGET}/release/${env:BINARY}.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match "VCRUNTIME140|api-ms-win-crt-") {
            throw "${env:BINARY}.exe links the C runtime dynamically"
          }

      # Generated on the platform being packaged rather than once for all
      # three: the dependency graph differs by target, so a page built on one
      # would omit what only another one links.
      - name: Generate the dependency license page
        run: cargo about generate about.hbs --output-file licenses.html

      - name: Stage the archive contents
        if: runner.os != 'macOS'
        run: |
          root="staging/$ARCHIVE"
          mkdir -p "$root"
          if [ -f "target/$TARGET/release/$BINARY.exe" ]; then
            cp "target/$TARGET/release/$BINARY.exe" "$root/"
          else
            cp "target/$TARGET/release/$BINARY" "$root/"
          fi
          cp LICENSE licenses.html "$root/"
          # An application with a README of its own carries it; one without is
          # not handed the repository's, which answers to this tree rather
          # than to the operator.
          if [ -f "apps/$APP/README.md" ]; then
            cp "apps/$APP/README.md" "$root/"
          fi
          if [ -n "$TEMPLATES" ]; then
            cp -r "$TEMPLATES" "$root/"
          fi

      # A Wayland compositor has no way to learn the window icon from the
      # application, so the Linux archive has to carry the desktop entry the
      # compositor reads it from.
      - name: Add the desktop entry to the Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p "staging/$ARCHIVE/assets"
          cp "apps/$APP/assets/$BINARY.desktop" "apps/$APP/assets/icon.png" \
            "staging/$ARCHIVE/assets/"

      # macOS gets a bundle in a disk image rather than an archive of bare
      # files: the bundle is what carries the icon and the microphone
      # permission text, and the image is what installs by drag and drop.
      - name: Build the application bundle and disk image
        if: runner.os == 'macOS'
        run: |
          bash package/build-app.sh "$APP" "target/$TARGET/release/$BINARY" \
            licenses.html "$ARCHIVE.dmg" "$TEMPLATES"

      - name: Create the tar archive
        if: runner.os == 'Linux'
        run: tar -czf "$ARCHIVE.tar.gz" -C staging "$ARCHIVE"

      - name: Create the zip archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "staging/${env:ARCHIVE}" -DestinationPath "${env:ARCHIVE}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error

  release:
    name: Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.ref }}
      TITLE: ${{ inputs.title }}
      VERSION: ${{ needs.prepare.outputs.version }}
      NOTES: ${{ inputs.notes }}
      PREFIX: grayline-${{ inputs.app }}-v${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: grayline-${{ inputs.app }}-*
          merge-multiple: true

      - name: Write the checksums and the release notes
        working-directory: artifacts
        run: |
          sha256sum "$PREFIX"* > SHA256SUMS
          printf '%s\n' "$NOTES" | sed "s/@VERSION@/v$VERSION/g" > notes.md

      # A re-run of a tag that was already released replaces its archives
      # rather than failing, which is what a rebuild is for.
      - name: Publish the release
        working-directory: artifacts
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "$PREFIX"* SHA256SUMS --clobber
          else
            gh release create "$TAG" --verify-tag \
              --title "$TITLE v$VERSION" --notes-file notes.md \
              "$PREFIX"* SHA256SUMS
          fi
