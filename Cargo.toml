[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tools/*"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "LGPL-3.0-or-later"
authors = ["Yū KOBAYASHI <kb10uy@kb10uy.org>"]
repository = "https://github.com/kb10uy/grayline"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
console_error_panic_hook = "0.1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
directories = "6.0"
eframe = "0.35"
embed-resource = "3.0"
egui = "0.35"
egui_extras = "0.35"
fontdb = "0.23"
egui_kittest = "0.35"
fluent-bundle = "0.16"
hound = "3.5"
muda = { version = "0.19", default-features = false }
raw-window-handle = "0.6"
jiff = "0.2"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
image-webp = "0.2"
kdl = "6.7"
libm = "0.2"
mlua = { version = "0.11", features = ["lua54", "vendored"] }
proptest = "1.7"
png = "0.18"
resvg = "0.47"
rstest = "0.26"
thiserror = { version = "2.0", default-features = false }
toml_edit = "0.25"
unic-langid = "0.9"
wasm-bindgen = "0.2"
windows-sys = "0.61"

# Panics keep unwinding: the receive and transmit workers are separate threads whose failure is reported to the interface,
# and aborting would take the whole session down with one of them.
[profile.release]
lto = true
strip = true
panic = "unwind"
