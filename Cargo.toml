[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tools/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "LGPL-3.0-or-later"
authors = ["Yū KOBAYASHI <kb10uy@kb10uy.org>"]
repository = "https://github.com/kb10uy/grayline"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
console_error_panic_hook = "0.1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
ctrlc = "3.5"
directories = "6.0"
encoding_rs = "0.8"
eframe = "0.37"
embed-resource = "3.0"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
fontdb = "0.24"
egui_kittest = "0.37"
fluent-bundle = "0.16"
hound = "3.5"
muda = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
jiff = "0.2"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
image-webp = "0.2"
kdl = "6.7"
libm = "0.2"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
proptest = "1.12"
png = "0.18"
resvg = "0.50"
rstest = "0.28"
rusqlite = { version = "0.42", features = ["bundled"] }
thiserror = { version = "2.0", default-features = false }
serde_json = "1.0"
serialport = { version = "4.10", default-features = false }
tempfile = "3.27"
toml_edit = "0.25"
unic-langid = "0.9"
wasm-bindgen = "0.2"
windows-sys = "0.61"

# Panics keep unwinding: the receive and transmit workers are separate threads whose failure is reported to the interface,
# and aborting would take the whole session down with one of them.
[profile.release]
lto = true
strip = true
panic = "unwind"
