[package]
name = "grayline-wefax-app"
description = "Weather fax reception for amateur radio"
version = "0.1.4"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "grayline-wefax"
path = "src/main.rs"

[dependencies]
directories.workspace = true
eframe.workspace = true
egui.workspace = true
fluent-bundle.workspace = true
fontdb.workspace = true
image.workspace = true
jiff.workspace = true
grayline-audio = { path = "../../crates/audio" }
grayline-shell = { path = "../../crates/shell" }
grayline-wefax = { path = "../../crates/wefax", features = ["std"] }
thiserror.workspace = true
toml_edit.workspace = true
unic-langid.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
hound.workspace = true
egui_kittest.workspace = true
rstest.workspace = true

# `cargo deb -p grayline-wefax-app` builds the Debian package from this. Asset
# sources are relative to this directory, except target/release/ paths, which
# cargo-deb resolves against the workspace target directory.
[package.metadata.deb]
name = "grayline-wefax"
section = "hamradio"
priority = "optional"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Weather fax reception for amateur radio: decodes HF radiofax charts from a \
capture device, following the transmission's own start, phasing, and stop \
signals, and correcting the line clock from the picture as it arrives."""
# $auto covers what the binary links (glibc, ALSA, gcc-s); the graphics and
# keyboard libraries are dlopen'd at runtime, which dpkg-shlibdeps cannot see,
# so they are named explicitly.
depends = ["$auto", "libxkbcommon0", "libxkbcommon-x11-0", "libegl1", "libgl1"]
recommends = ["xdg-utils", "fonts-noto-cjk"]
suggests = ["fonts-dejavu-core"]
assets = [
    ["target/release/grayline-wefax", "usr/bin/", "755"],
    ["assets/grayline-wefax.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/grayline-wefax.png", "644"],
]
